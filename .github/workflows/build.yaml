name: Bygg image og push til GAR
on:
  push:
    branches:
      - main


permissions: {}

jobs:
  build:
    permissions:
      contents: write
      id-token: write
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic
          dependency-graph: generate-and-submit
      - name: Compile, run tests and build
        run: ./gradlew test installDist
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push docker image
        uses: nais/docker-build-push@v0
        id: docker-push
        with:
          team: pia
          tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'branch_latest' }}
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

# Deploy nattlige jobber
  deploy-oppdater-view:
    needs: build
    strategy:
      matrix:
        cluster: [dev, prod]
    permissions:
      id-token: write
    name: Deployer nattlig view-oppdatering til ${{ matrix.cluster }}-gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy application to ${{ matrix.cluster }}-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ matrix.cluster }}-gcp
          RESOURCE: .nais/nais_nattlig.yaml
          VARS: .nais/${{ matrix.cluster }}-gcp.yaml
          VAR: SCHEDULE=0 1 * * *,JOBB=materializedViewOppdatering,JOBB_NAVN_NAISVENNLIG=oppdater-view

  deploy-prosesser-planlagte-hendelser:
    needs: build
    strategy:
      matrix:
        cluster: [dev, prod]
    permissions:
      id-token: write
    name: Deployer nattlig prosessering av planlagte hendelser til ${{ matrix.cluster }}-gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy application to ${{ matrix.cluster }}-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ matrix.cluster }}-gcp
          RESOURCE: .nais/nais_nattlig.yaml
          VARS: .nais/${{ matrix.cluster }}-gcp.yaml
          VAR: SCHEDULE=1 2 * * *,JOBB=prosesserPlanlagteHendelser,JOBB_NAVN_NAISVENNLIG=prosesser-planlagte-hendelser

  # Deploy daglige jobber
  # Sjekk publiseringsdato og importer sykefraværsstatistikk (denne kjører - foreløpig - med parameter DRY_RUN for å unngå utsending av Kafka meldinger i dev)
  deploy-sjekk-publiseringsdato:
    needs: build
    strategy:
      matrix:
        cluster: [dev]
    permissions:
      id-token: write
    name: Deployer daglig publiseringsdato-sjekk til ${{ matrix.cluster }}-gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy application to ${{ matrix.cluster }}-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ matrix.cluster }}-gcp
          RESOURCE: .nais/nais_daglig.yaml
          VARS: .nais/${{ matrix.cluster }}-gcp.yaml
          VAR: SCHEDULE=5 8 * * *,PARAMETER=DRY_RUN,JOBB=sjekkPubliseringsdatoOgImporter,JOBB_NAVN_NAISVENNLIG=sjekk-publiseringsdato

# Import av publiseringsdato(er) (denne kjører - foreløpig - med parameter DRY_RUN for å unngå utsending av Kafka meldinger i dev)
  deploy-publiseringsdato-dvh-import:
    needs: build
    strategy:
      matrix:
        cluster: [dev]
    permissions:
      id-token: write
    name: Deployer daglig publiseringsdato-import til ${{ matrix.cluster }}-gcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Deploy application to ${{ matrix.cluster }}-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          CLUSTER: ${{ matrix.cluster }}-gcp
          RESOURCE: .nais/nais_daglig.yaml
          VARS: .nais/${{ matrix.cluster }}-gcp.yaml
          VAR: SCHEDULE=50 16 * * *,PARAMETER=DRY_RUN,JOBB=publiseringsdatoDvhImport,JOBB_NAVN_NAISVENNLIG=publiseringsdato-dvh-import

  trivy-scan:
    name: Scanner docker image med Trivy
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: read # to write sarif
      security-events: write # push sarif to github security
      id-token: write # for nais/login
    runs-on: ubuntu-latest
    steps:
      - uses: navikt/pia-actions/trivy-scan@a7e3f6b39a28f0544600fcce70933e3c69c6b7a7 # v1.1.15
        with:
          image: ${{ needs.build.outputs.image }}
          team: pia
          upload-artifact: true
